# This is a Declarative Automation Bundle definition for youtube_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: youtube_pipeline
  uuid: d7b2e225-509c-443f-8a4d-bab8881b8c70

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-0ffd98b2-2861.cloud.databricks.com
    variables:
      catalog: youtube_coffee_creators
      schema: bronze
  prod:
    mode: production
    workspace:
      host: https://dbc-0ffd98b2-2861.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/bista.alish11@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/bista.alish11@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: youtube_coffee_creators
      schema: bronze
    permissions:
      - user_name: bista.alish11@gmail.com
        level: CAN_MANAGE
